name: Live Gemini API check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - name: Test real Gemini and deterministic outage fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/smoke_api.py --output backend/evaluation/github-live-api-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-live-api-report
          path: backend/evaluation/github-live-api-check.json
